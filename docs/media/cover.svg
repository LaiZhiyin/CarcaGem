  <text x="60" y="289" fill="#B1DAD0" font-family="sans-serif" font-size="19">Coding, Deployment, Testing and Iteration.</text>
  <text x="60" y="338" fill="#B1DAD0" font-family="sans-serif" font-size="18">Tile strategy, human feedback, and inspectable AI.</text>
