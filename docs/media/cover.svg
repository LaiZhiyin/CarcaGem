  <title id="title">CarcaGem｜Board Game — A full-loop AI Coding Product Workflow</title>
  <desc id="desc">An ocean-blue board game portfolio cover presenting user research, product planning, PRD drafting, coding, deployment, testing and iteration, with player count, play time, age guidance, star rating and connected island tiles.</desc>
